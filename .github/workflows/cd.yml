name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: checkout the code
        uses: actions/checkout@v6

      - name: set up node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: install dependencies
        run: npm ci

      - name: build the app
        run: npm run build
